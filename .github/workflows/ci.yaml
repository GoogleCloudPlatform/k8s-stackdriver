name: continuous-integration

on:
  push:
    branches:
      - master
    tags:
      - v0.*
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-unit-tests:
    name: ci-unit-tests-${{ matrix.component.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: custom-metrics-stackdriver-adapter
            dir: custom-metrics-stackdriver-adapter
            build-target: build
          - name: prometheus-to-sd
            dir: prometheus-to-sd
            build-target: build
          - name: event-exporter
            dir: event-exporter
            build-target: build
          - name: kubelet-to-gcm
            dir: kubelet-to-gcm
            build-target: compile
          - name: cloud-monitoring-proxy
            dir: cloud-monitoring-proxy
            build-target: build
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Go from module
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: ${{ matrix.component.dir }}/go.mod
        cache: true
        cache-dependency-path: ${{ matrix.component.dir }}/go.sum
      id: go

    - name: Unit tests
      working-directory: ${{ matrix.component.dir }}
      run: make test

  ci-build:
    name: ci-build-${{ matrix.component.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: custom-metrics-stackdriver-adapter
            dir: custom-metrics-stackdriver-adapter
            build-target: build
          - name: prometheus-to-sd
            dir: prometheus-to-sd
            build-target: build
          - name: event-exporter
            dir: event-exporter
            build-target: build
          - name: kubelet-to-gcm
            dir: kubelet-to-gcm
            build-target: compile
          - name: cloud-monitoring-proxy
            dir: cloud-monitoring-proxy
            build-target: build
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Go from module
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: ${{ matrix.component.dir }}/go.mod
        cache: true
        cache-dependency-path: ${{ matrix.component.dir }}/go.sum
      id: go

    - name: Build
      working-directory: ${{ matrix.component.dir }}
      run: make ${{ matrix.component.build-target }}

  ci-container-build:
    name: ci-container-build-${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - custom-metrics-stackdriver-adapter
          - prometheus-to-sd
          - event-exporter
          - kubelet-to-gcm
          - cloud-monitoring-proxy
    steps:
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Build container
      working-directory: ${{ matrix.component }}
      run: docker build .
