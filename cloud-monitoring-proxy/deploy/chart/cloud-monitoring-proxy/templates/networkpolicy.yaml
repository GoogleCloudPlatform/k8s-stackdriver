{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cmproxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cmproxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cmproxy.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: 9090
{{- end }}
